[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustxai"
version = "0.1.0"
description = "A Unified Diagnostic Framework for Assessing Explanation Stability, Uncertainty Calibration, and Robustness in Machine Learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mariam Zakaria", email = "researcher@example.com"}
]
keywords = [
    "explainable-ai",
    "xai",
    "conformal-prediction",
    "model-robustness",
    "lipschitz-stability",
    "trustworthy-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.1.0",
]

[project.optional-dependencies]
explainers = [
    "shap>=0.42.0",
]
dev = [
    "pytest>=7.0.0",
    "flake8>=5.0.0",
    "black>=23.0.0",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
    "@abstractmethod",
]

[project.urls]
"Homepage" = "https://github.com/MariamZakaria/trustxai"
"Bug Tracker" = "https://github.com/MariamZakaria/trustxai/issues"
